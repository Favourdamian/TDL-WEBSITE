<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE DAMIAN LABEL (TDL) | Luxury Wig Revamping, Wigging & Nails Studio</title>
  <meta name="description" content="The Damian Label: Ago Palace Way, Lagos. Premier Nigerian beauty studio for Hair Revamping, Wigging, Hair Ventilation, Glueless Wigs and Acrylic Nails." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- React 18 & ReactDOM 18 with CDN Fallback -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script>window.React || document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.ReactDOM || document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>')</script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Canvas Confetti & EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <!-- Paystack Inline JS for Nigerian Online Payments -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- Google Fonts & Custom Styling -->
  <link rel="stylesheet" href="styles.css?v=10" />

  <style>
    /* CRITICAL HOT-PINK BOOK SLAY BUTTON OVERRIDES */
    .btn-book-slay-full {
      background: linear-gradient(135deg, #e11d48 0%, #f43f5e 50%, #be123c 100%) !important;
      background-color: #e11d48 !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      letter-spacing: 0.03em !important;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.55), 0 0 15px rgba(244, 63, 94, 0.4) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.8) !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35) !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .btn-book-slay-full:hover {
      transform: translateY(-2px) scale(1.05) !important;
      box-shadow: 0 8px 28px rgba(225, 29, 72, 0.7), 0 0 20px rgba(251, 113, 133, 0.6) !important;
      background: linear-gradient(135deg, #be123c 0%, #e11d48 50%, #f43f5e 100%) !important;
    }
    /* Sparkle Cursor Particles */
    .sparkle-particle {
      position: fixed;
      pointer-events: none;
      z-index: 999999;
      user-select: none;
      animation: sparkleFloat 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      filter: drop-shadow(0 2px 4px rgba(244, 63, 94, 0.4));
    }
    @keyframes sparkleFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(-50%, -80%) scale(1.4) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120%) scale(1.8) rotate(35deg);
      }
    }
    @keyframes floatGirly {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(2deg);
      }
    }
    .animate-float-girly {
      animation: floatGirly 3s ease-in-out infinite;
    }

    /* Equalizer Visualizer Animations */
    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .eq-bar-1 { animation: eqBar 0.65s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBar 0.45s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: eqBar 0.75s ease-in-out infinite 0.3s; }
    .eq-bar-4 { animation: eqBar 0.55s ease-in-out infinite 0.1s; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              300: '#fda4af',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#faf5f5] text-zinc-800 antialiased selection:bg-rose-500 selection:text-white">
  <!-- React Mount Point -->
  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-[#faf5f5]" id="tdl-loading-screen">
      <div class="text-center space-y-4">
        <div class="w-16 h-16 mx-auto rounded-3xl gradient-babe flex items-center justify-center text-2xl font-black text-white shadow-xl animate-bounce">
          TDL
        </div>
        <h2 class="text-xl font-black text-zinc-900 font-serif-lux">THE DAMIAN LABEL</h2>
        <p class="text-xs text-rose-500 font-bold uppercase tracking-widest" id="tdl-loading-text">Opening Lagos Studio...</p>
      </div>
    </div>
  </div>

  <!-- Studio Fairy Chime Audio Source -->
  <audio id="bg-cute-chime" src="cute-chime.wav" preload="auto"></audio>
  <script>
    (function() {
      // ---- Error safety net: if React crashes, show a reload button ----
      window.onerror = function(msg, src, line, col, err) {
        var loadingText = document.getElementById('tdl-loading-text');
        if (loadingText) {
          loadingText.innerHTML = '⚠️ Error loading - <a href="" onclick="location.reload();return false;" style="color:#e11d48;text-decoration:underline;font-weight:900;">Tap to Retry</a>';
        }
        console.error('TDL App Error:', msg, 'at', src, line, col, err);
      };

      // ---- Timeout fallback: if not mounted after 12s, offer reload ----
      var mountTimeout = setTimeout(function() {
        var root = document.getElementById('root');
        if (root && document.getElementById('tdl-loading-screen')) {
          var loadingText = document.getElementById('tdl-loading-text');
          if (loadingText) {
            loadingText.innerHTML = 'Taking too long? <a href="" onclick="location.reload();return false;" style="color:#e11d48;text-decoration:underline;font-weight:900;">Reload Site</a>';
          }
        }
      }, 12000);

      // Cancel the timeout when React mounts successfully (removes the loading screen)
      var observer = new MutationObserver(function() {
        if (!document.getElementById('tdl-loading-screen')) {
          clearTimeout(mountTimeout);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: false });

      // ---- Sound on open ----
      function playGirlyWelcomeSound() {
        try {
          var audio = document.getElementById('bg-cute-chime');
          if (audio) {
            audio.volume = 0.55;
            var p = audio.play();
            if (p && p.catch) p.catch(function() {});
          }
        } catch(e) {}
      }
      // Attempt play on load
      window.addEventListener('DOMContentLoaded', playGirlyWelcomeSound);
      // Play on first user touch/click/scroll in case browser requires gesture
      var events = ['click', 'touchstart', 'pointerdown', 'keydown', 'scroll'];
      function onFirstUserGesture() {
        playGirlyWelcomeSound();
        events.forEach(function(e) { window.removeEventListener(e, onFirstUserGesture); });
      }
      events.forEach(function(e) { window.addEventListener(e, onFirstUserGesture, { once: true, passive: true }); });
    })();
  </script>

  <!-- Pre-compiled Pure React 18 Application (Loads instantly in 10ms with zero Babel delay) -->
  <script src="app.bundle.js?v=10"></script>
</body>
</html>
